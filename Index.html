<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoreo TI · Sofitasa</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ============================================================
       TEMA CLARO (por defecto)
       ============================================================ */
    :root{
      --primary:#4099ff;
      --primary-dark:#2d7fd6;
      --primary-light:#6fb8ff;
      --success:#2ed8b6;
      --warning:#ffb64d;
      --danger:#ff5370;
      --purple:#c65cf1;

      --bg:#f4f6fb;
      --bg-elevated:#ffffff;
      --bg-subtle:#fafbfd;
      --bg-hover:#f4f7fc;

      --text:#2b3445;
      --text-secondary:#5f6b7c;
      --muted:#8e98a8;
      --border:#e8ecf3;
      --border-strong:#d5dbe6;

      --sidebar-bg-start:#1f2a3d;
      --sidebar-bg-end:#15202e;
      --sidebar-fg:#9aa8bc;
      --sidebar-fg-active:#ffffff;
      --sidebar-active-bg:rgba(64,153,255,.16);

      --shadow-sm:0 1px 3px rgba(31,42,61,.06);
      --shadow:0 4px 16px rgba(31,42,61,.08);
      --shadow-lg:0 12px 32px rgba(31,42,61,.12);
      --shadow-primary:0 8px 24px rgba(64,153,255,.25);

      --radius-sm:6px;
      --radius:10px;
      --radius-lg:14px;

      --chart-grid:#eef2f8;
      --chart-text:#8e98a8;

      --transition: .3s cubic-bezier(.4,0,.2,1);
    }

    /* ============================================================
       TEMA OSCURO
       ============================================================ */
    html[data-theme="dark"]{
      --bg:#0f1720;
      --bg-elevated:#1a2332;
      --bg-subtle:#141d2a;
      --bg-hover:#212d3f;

      --text:#e6edf5;
      --text-secondary:#a8b5c7;
      --muted:#6b7a8f;
      --border:#26344a;
      --border-strong:#334257;

      --sidebar-bg-start:#0a1119;
      --sidebar-bg-end:#060c13;
      --sidebar-fg:#7c8aa0;
      --sidebar-fg-active:#ffffff;
      --sidebar-active-bg:rgba(64,153,255,.18);

      --shadow-sm:0 1px 3px rgba(0,0,0,.35);
      --shadow:0 4px 16px rgba(0,0,0,.4);
      --shadow-lg:0 12px 32px rgba(0,0,0,.5);
      --shadow-primary:0 8px 24px rgba(64,153,255,.35);

      --chart-grid:#243044;
      --chart-text:#7c8aa0;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      background:var(--bg);
      color:var(--text);
      font-family:'Open Sans',system-ui,-apple-system,sans-serif;
      font-size:14px;
      line-height:1.5;
      transition:background var(--transition), color var(--transition);
    }
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:2px solid var(--bg)}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .pc-sidebar{
      position:fixed;top:0;left:0;bottom:0;width:260px;
      background:linear-gradient(180deg,var(--sidebar-bg-start),var(--sidebar-bg-end));
      color:var(--sidebar-fg);
      overflow-y:auto;z-index:200;
      transition:transform var(--transition);
      box-shadow:2px 0 20px rgba(0,0,0,.15);
    }
    .pc-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-color:transparent}

    .pc-sidebar .brand{
      display:flex;flex-direction:column;gap:2px;
      padding:24px 22px 20px;
      font-size:15px;font-weight:700;color:#fff;
      border-bottom:1px solid rgba(255,255,255,.06);
      letter-spacing:.2px;
    }
    .pc-sidebar .brand .brand-top{
      display:flex;align-items:center;gap:8px;
    }
    .pc-sidebar .brand .logo-mark{
      color:var(--primary);
      font-size:20px;
      filter:drop-shadow(0 0 8px rgba(64,153,255,.6));
      animation:pulse 3s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1}
      50%{opacity:.65}
    }
    .pc-sidebar .brand small{
      opacity:.5;font-weight:400;font-size:11px;
      padding-left:28px;line-height:1.3;
    }

    .pc-sidebar .nav-group-title{
      padding:18px 22px 6px;
      font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:1.5px;
      color:rgba(255,255,255,.28);
    }
    .pc-sidebar ul{list-style:none}
    .pc-sidebar li a{
      position:relative;
      display:flex;align-items:center;gap:12px;
      padding:11px 22px;
      color:var(--sidebar-fg);
      font-size:13.5px;font-weight:500;
      border-left:3px solid transparent;
      transition:all .2s;
      cursor:pointer;
    }
    .pc-sidebar li a:hover{
      background:rgba(255,255,255,.04);
      color:#fff;
      padding-left:26px;
    }
    .pc-sidebar li.active a{
      background:var(--sidebar-active-bg);
      color:var(--sidebar-fg-active);
      border-left-color:var(--primary);
      font-weight:600;
    }
    .pc-sidebar li.active a::before{
      content:'';
      position:absolute;left:0;top:50%;transform:translateY(-50%);
      width:3px;height:60%;background:var(--primary);
      border-radius:0 3px 3px 0;
      box-shadow:0 0 12px var(--primary);
    }
    .pc-sidebar .nav-ico{
      font-size:15px;width:22px;text-align:center;
      filter:grayscale(.3);transition:filter .2s;
    }
    .pc-sidebar li.active .nav-ico,
    .pc-sidebar li a:hover .nav-ico{filter:grayscale(0)}

    /* ============================================================
       LAYOUT
       ============================================================ */
    .pc-content{
      margin-left:260px;min-height:100vh;
      transition:margin var(--transition);
    }

    /* HEADER */
    .pc-header{
      position:sticky;top:0;z-index:100;height:68px;
      padding:0 28px;
      background:var(--bg-elevated);
      display:flex;align-items:center;gap:18px;
      border-bottom:1px solid var(--border);
      backdrop-filter:saturate(180%) blur(12px);
      transition:background var(--transition), border-color var(--transition);
    }
    .hamburger{
      display:none;font-size:22px;padding:8px 12px;
      color:var(--text);border-radius:8px;
      transition:background .2s;
    }
    .hamburger:hover{background:var(--bg-hover)}

    .pc-search{
      flex:1;max-width:520px;
      display:flex;align-items:center;gap:10px;
      background:var(--bg-subtle);
      border:1px solid var(--border);
      border-radius:22px;padding:9px 18px;
      transition:all .2s;
    }
    .pc-search:focus-within{
      background:var(--bg-elevated);
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(64,153,255,.12);
    }
    .pc-search span{opacity:.55;font-size:13px}
    .pc-search input{
      flex:1;border:none;background:transparent;outline:none;
      font-size:13.5px;color:var(--text);font-family:inherit;
    }
    .pc-search input::placeholder{color:var(--muted)}

    .pc-header-right{
      margin-left:auto;display:flex;align-items:center;gap:12px;
    }
    .theme-toggle{
      width:42px;height:42px;border-radius:50%;
      background:var(--bg-subtle);
      border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:16px;
      transition:all .3s;
      position:relative;overflow:hidden;
    }
    .theme-toggle:hover{
      background:var(--bg-hover);
      transform:rotate(20deg) scale(1.05);
      border-color:var(--primary);
    }
    .theme-toggle .ico-sun,
    .theme-toggle .ico-moon{
      position:absolute;
      transition:transform .4s cubic-bezier(.4,0,.2,1), opacity .3s;
    }
    .theme-toggle .ico-sun{transform:translateY(0) rotate(0deg);opacity:1}
    .theme-toggle .ico-moon{transform:translateY(30px) rotate(90deg);opacity:0}
    html[data-theme="dark"] .theme-toggle .ico-sun{transform:translateY(-30px) rotate(-90deg);opacity:0}
    html[data-theme="dark"] .theme-toggle .ico-moon{transform:translateY(0) rotate(0deg);opacity:1}

    .user-chip{
      display:flex;align-items:center;gap:10px;
      padding:6px 14px;
      background:var(--bg-subtle);
      border-radius:24px;
      transition:background .2s;
    }
    .user-chip:hover{background:var(--bg-hover)}
    .user-info{display:flex;flex-direction:column;line-height:1.2;text-align:right}
    .user-name{font-weight:600;font-size:12.5px;color:var(--text)}
    .user-role{font-size:10.5px;color:var(--muted)}

    /* ============================================================
       MAIN
       ============================================================ */
    .pc-main{padding:26px 28px}
    .page-header{
      display:flex;align-items:baseline;gap:14px;
      margin-bottom:22px;
    }
    .page-header h1{
      font-size:21px;font-weight:600;color:var(--text);
      padding-left:14px;
      border-left:4px solid var(--primary);
      line-height:1.2;
    }
    .page-header .last-update{color:var(--muted);font-size:12px}
    .page-header .crumb{
      margin-left:auto;color:var(--muted);font-size:11px;
      letter-spacing:.8px;text-transform:uppercase;font-weight:600;
    }

    /* ============================================================
       FILTER BAR
       ============================================================ */
    .filter-bar{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:14px 20px;margin-bottom:22px;
      display:flex;flex-wrap:wrap;align-items:center;gap:14px;
      transition:background var(--transition), border-color var(--transition);
    }
    .filter-bar-label{
      font-size:11px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.8px;
    }
    .filter-segment{
      display:flex;gap:4px;
      background:var(--bg-subtle);
      padding:4px;border-radius:22px;
      border:1px solid var(--border);
    }
    .filter-segment button{
      padding:7px 18px;border-radius:18px;
      font-size:12.5px;font-weight:600;
      color:var(--muted);
      transition:all .2s;
    }
    .filter-segment button:hover{color:var(--primary)}
    .filter-segment button.active{
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:#fff;
      box-shadow:var(--shadow-primary);
    }

    .filter-inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .filter-inputs input,.filter-inputs select{
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      font-size:13px;font-family:inherit;
      color:var(--text);
      background:var(--bg-subtle);
      outline:none;
      transition:all .2s;
    }
    .filter-inputs input:focus,
    .filter-inputs select:focus{
      border-color:var(--primary);
      background:var(--bg-elevated);
      box-shadow:0 0 0 3px rgba(64,153,255,.12);
    }

    .btn-clear{
      margin-left:auto;
      padding:9px 18px;border-radius:20px;
      background:rgba(255,83,112,.12);
      color:var(--danger);
      font-size:12.5px;font-weight:600;
      display:flex;align-items:center;gap:6px;
      transition:all .2s;
    }
    .btn-clear:hover{background:rgba(255,83,112,.2);transform:translateY(-1px)}
    .btn-clear:disabled{opacity:.4;cursor:not-allowed;transform:none}

    .filter-badge{
      display:inline-block;padding:4px 12px;
      background:rgba(64,153,255,.12);
      color:var(--primary);
      border-radius:12px;font-size:11px;font-weight:700;
      margin-left:4px;
    }

    /* ============================================================
       KPI CARDS
       ============================================================ */
    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:16px;margin-bottom:22px;
    }
    .kpi{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:18px 20px;
      display:flex;flex-direction:column;gap:5px;
      position:relative;overflow:hidden;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      cursor:default;
    }
    .kpi:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow-lg);
      border-color:var(--border-strong);
    }
    .kpi::before{
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--primary),var(--primary-light));
    }
    .kpi.success::before{background:linear-gradient(90deg,var(--success),#5ee7c8)}
    .kpi.danger::before{background:linear-gradient(90deg,var(--danger),#ff8aa0)}
    .kpi.warning::before{background:linear-gradient(90deg,var(--warning),#ffd28a)}
    .kpi.purple::before{background:linear-gradient(90deg,var(--purple),#dd8af7)}

    .kpi .kpi-label{
      font-size:11px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.6px;
    }
    .kpi .kpi-value{
      font-size:25px;font-weight:700;
      color:var(--text);letter-spacing:-.5px;
      font-variant-numeric:tabular-nums;
    }
    .kpi .kpi-ico{
      position:absolute;top:16px;right:18px;
      font-size:22px;opacity:.18;
      transition:all .3s;
    }
    .kpi:hover .kpi-ico{opacity:.4;transform:scale(1.15) rotate(-8deg)}

    /* ============================================================
       CHARTS
       ============================================================ */
    .chart-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
      gap:20px;margin-bottom:22px;
    }
    .chart-card{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:20px;
      display:flex;flex-direction:column;
      transition:background var(--transition), border-color var(--transition);
    }
    .chart-card:hover{box-shadow:var(--shadow)}
    .chart-card h3{
      font-size:13.5px;font-weight:600;
      color:var(--text);margin-bottom:14px;
      display:flex;align-items:center;gap:8px;
    }
    .chart-card h3::before{
      content:'';display:inline-block;
      width:4px;height:14px;border-radius:2px;
      background:var(--primary);
    }
    .chart-wrap{position:relative;width:100%;height:280px}

    /* ============================================================
       TABLE
       ============================================================ */
    .table-card{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:20px;margin-bottom:22px;
      transition:background var(--transition), border-color var(--transition);
    }
    .table-card h3{
      font-size:13.5px;font-weight:600;color:var(--text);
      margin-bottom:14px;display:flex;align-items:center;gap:8px;
    }
    .table-card h3::before{
      content:'';display:inline-block;
      width:4px;height:14px;border-radius:2px;
      background:var(--primary);
    }
    .table-scroll{overflow-x:auto;margin-top:6px;border-radius:var(--radius-sm)}
    table.data{
      width:100%;border-collapse:collapse;
      font-size:12.5px;white-space:nowrap;
    }
    table.data th,table.data td{
      padding:11px 14px;
      text-align:left;
      border-bottom:1px solid var(--border);
      transition:background .15s;
    }
    table.data th{
      font-weight:600;font-size:10.5px;
      text-transform:uppercase;letter-spacing:.5px;
      color:var(--muted);
      background:var(--bg-subtle);
      position:sticky;top:0;
    }
    table.data tbody tr:hover td{background:var(--bg-hover)}
    table.data tbody tr:last-child td{border-bottom:none}
    .num{text-align:right;font-variant-numeric:tabular-nums}

    .pill{
      display:inline-block;padding:4px 11px;
      border-radius:12px;font-size:11px;font-weight:700;
      letter-spacing:.3px;
    }
    .pill.ok{background:rgba(46,216,182,.14);color:var(--success)}
    .pill.warn{background:rgba(255,182,77,.16);color:#e09b3d}
    .pill.bad{background:rgba(255,83,112,.14);color:var(--danger)}

    /* ============================================================
       LOADER & EMPTY
       ============================================================ */
    .loader{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:100px 20px;gap:18px;
      color:var(--muted);
    }
    .spinner{
      width:46px;height:46px;border-radius:50%;
      border:3px solid var(--border);
      border-top-color:var(--primary);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{color:var(--danger);padding:20px;font-weight:600}

    .filter-empty{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:70px 20px;text-align:center;color:var(--muted);
    }
    .filter-empty .ico{font-size:52px;opacity:.3;margin-bottom:16px}
    .filter-empty p{font-size:15px;margin-bottom:8px;color:var(--text)}
    .filter-empty small{font-size:12.5px;opacity:.8}

    /* ============================================================
       DASHBOARD CARDS
       ============================================================ */
    .dash-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:20px;
    }
    .dash-card{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:22px;
      display:flex;flex-direction:column;gap:10px;
      cursor:pointer;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      position:relative;overflow:hidden;
    }
    .dash-card::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--primary),var(--purple));
      transform:scaleX(0);transform-origin:left;
      transition:transform .35s;
    }
    .dash-card:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-lg);
      border-color:var(--primary);
    }
    .dash-card:hover::before{transform:scaleX(1)}

    .dash-card .dash-ico{
      width:52px;height:52px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:24px;
      background:linear-gradient(135deg,rgba(64,153,255,.14),rgba(198,92,241,.14));
      color:var(--primary);
      transition:transform .3s;
    }
    .dash-card:hover .dash-ico{transform:scale(1.1) rotate(-5deg)}

    .dash-card h2{
      font-size:28px;font-weight:700;color:var(--text);
      letter-spacing:-.5px;
    }
    .dash-card p{
      color:var(--muted);font-size:11.5px;font-weight:600;
      text-transform:uppercase;letter-spacing:.8px;
    }
    .dash-card small{font-size:12px}
    .dash-card .arrow{
      position:absolute;top:22px;right:22px;
      color:var(--muted);font-size:20px;
      transition:all .3s;
    }
    .dash-card:hover .arrow{
      color:var(--primary);
      transform:translateX(4px);
    }

    /* ============================================================
       OBSERVACIONES
       ============================================================ */
    .obs-list{display:grid;gap:16px}
    .obs-card{
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-left:4px solid var(--primary);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      padding:20px;
      transition:all .2s;
    }
    .obs-card:hover{
      box-shadow:var(--shadow);
      transform:translateX(2px);
    }
    .obs-card h4{
      font-size:13.5px;margin-bottom:12px;
      color:var(--primary);font-weight:600;
    }
    .obs-card pre{
      font-family:'Open Sans',system-ui,sans-serif;
      white-space:pre-wrap;word-wrap:break-word;
      font-size:13px;line-height:1.6;
      color:var(--text-secondary);
    }
    .obs-card details summary{
      font-size:12.5px;color:var(--primary);font-weight:600;
      cursor:pointer;padding:6px 0;
      transition:color .2s;
    }
    .obs-card details summary:hover{color:var(--primary-dark)}

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media(max-width:1024px){
      .chart-grid{grid-template-columns:1fr}
      .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
    }
    @media(max-width:860px){
      .pc-sidebar{transform:translateX(-100%)}
      .pc-sidebar.open{transform:translateX(0)}
      .pc-content{margin-left:0}
      .hamburger{display:inline-flex}
      .pc-main{padding:18px 16px}
      .pc-header{padding:0 14px;height:62px}
      .pc-search{max-width:none}
      .user-info{display:none}
      .user-chip{padding:6px 10px}
      .filter-bar{padding:12px 14px;gap:10px}
      .filter-inputs{width:100%}
      .page-header h1{font-size:18px}
      .page-header .crumb{display:none}
    }
  </style>
</head>
<body>

<!-- ============ SIDEBAR ============ -->
<aside class="pc-sidebar" id="pcSidebar">
  <div class="brand">
    <div class="brand-top">
      <span class="logo-mark">✦</span>
      <span>Monitoreo TI</span>
    </div>
    <small>Gerencia de Continuidad y Cumplimiento</small>
  </div>
  <nav id="navContainer"></nav>
</aside>

<!-- ============ CONTENT ============ -->
<div class="pc-content">
  <header class="pc-header">
    <button class="hamburger" id="btnMenu" type="button" aria-label="Menú">☰</button>

    <div class="pc-search">
      <span>🔍</span>
      <input type="text" placeholder="Buscar...">
    </div>

    <div class="pc-header-right">
      <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
        <span class="ico-sun">☀️</span>
        <span class="ico-moon">🌙</span>
      </button>

      <div class="user-chip">
        <div class="user-info">
          <span class="user-name">Monitoreo de Servicios TI</span>
          <span class="user-role">Operador</span>
        </div>
      </div>
    </div>
  </header>

  <main class="pc-main">
    <div class="page-header">
      <h1 id="pageTitle">Cargando…</h1>
      <span class="last-update" id="lastUpdate">—</span>
      <span class="crumb" id="pageCrumb">INICIO</span>
    </div>

    <div id="filterBarContainer"></div>
    <div id="viewContainer"></div>
  </main>
</div>

<!-- ============ SCRIPT ÚNICO ============ -->
<script>
/* ============================================================
   1. TEMA CLARO / OSCURO
   ============================================================ */
(function initTheme() {
  const saved = localStorage.getItem('pc-theme');
  const prefersDark = window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('pc-theme', next);
  // Re-render charts con nuevos colores del eje
  setTimeout(() => {
    if (RAW_DATA && CURRENT_PAGE) renderGenericBody();
  }, 100);
}

/* Detecta preferencia del sistema si el usuario no ha elegido */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!localStorage.getItem('pc-theme')) {
    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  }
});

/* ============================================================
   2. CONFIGURACIÓN
   ============================================================ */
const NAV = [
  { id:'dashboard',          label:'Dashboard',           icon:'📊', group:'General',  title:'Dashboard General',       crumb:'INICIO / DASHBOARD' },
  { id:'pos-propios',        label:'POS Propios',         icon:'💳', group:'Canales',  title:'POS Propios · Sofitasa',  crumb:'INICIO / CANALES / POS PROPIOS' },
  { id:'pos-otros',          label:'POS Otros Bancos',    icon:'🏦', group:'Canales',  title:'POS Otros Bancos',        crumb:'INICIO / CANALES / POS OTROS' },
  { id:'p2p',                label:'P2P',                 icon:'🔁', group:'Canales',  title:'P2P',                     crumb:'INICIO / CANALES / P2P' },
  { id:'transferencias',     label:'Transferencias',      icon:'📤', group:'Canales',  title:'Transferencias',          crumb:'INICIO / CANALES / TRANSFERENCIAS' },
  { id:'credito-inmediato',  label:'Crédito Inmediato',   icon:'⚡', group:'Canales',  title:'Crédito Inmediato',       crumb:'INICIO / CANALES / CRÉDITO INM.' },
  { id:'debito-inmediato',   label:'Débito Inmediato',    icon:'💠', group:'Canales',  title:'Débito Inmediato',        crumb:'INICIO / CANALES / DÉBITO INM.' },
  { id:'estadistica-diaria', label:'Estadística Diaria',  icon:'📝', group:'Reportes', title:'Estadística Diaria',      crumb:'INICIO / REPORTES / DIARIA' },
  { id:'est-semanales',      label:'Estadística Semanal', icon:'📆', group:'Reportes', title:'Estadística Semanal',     crumb:'INICIO / REPORTES / SEMANAL' },
  { id:'est-trimestrales',   label:'Estadística Mensual', icon:'🗓', group:'Reportes', title:'Estadística Mensual',     crumb:'INICIO / REPORTES / MENSUAL' }
];

const FILTERED_PAGES = new Set([
  'pos-propios','pos-otros','p2p','transferencias','credito-inmediato','debito-inmediato'
]);

/* ============================================================
   3. HELPERS
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmtInt = n => (n||0).toLocaleString('es-VE');
const fmtPct = n => ((n||0)*100).toFixed(2)+'%';
const fmtNum = (n, d) => (n||0).toFixed(d===undefined?2:d);
const esc = s => String(s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Colores dinámicos según tema (para los ejes de los charts) */
function chartColors() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    grid: isDark ? '#243044' : '#eef2f8',
    text: isDark ? '#7c8aa0' : '#8e98a8'
  };
}

function toDateObj(fecha) {
  const m = String(fecha || '').match(/^(\d{1,2})\/(\d{1,2})$/);
  if (!m) return null;
  return new Date(2026, Number(m[2]) - 1, Number(m[1]));
}

/* ============================================================
   4. ESTADO GLOBAL
   ============================================================ */
let CURRENT_PAGE = 'dashboard';
let RAW_DATA = null;
let chartRefs = [];

const FILTER_STATE = { type: 'all', day: '', month: '', quarter: '' };

function destroyAllCharts() {
  chartRefs.forEach(c => { try { c.destroy(); } catch(e){} });
  chartRefs = [];
}

/* ============================================================
   5. SIDEBAR
   ============================================================ */
function renderSidebar() {
  const cont = $('#navContainer');
  let currentGroup = '';
  let html = '';
  NAV.forEach(item => {
    if (item.group !== currentGroup) {
      if (currentGroup) html += '</ul>';
      currentGroup = item.group;
      html += `<div class="nav-group-title">${item.group}</div><ul>`;
    }
    html += `<li data-page="${item.id}">
      <a href="javascript:void(0)" data-page="${item.id}" class="nav-link">
        <span class="nav-ico">${item.icon}</span>
        <span>${item.label}</span>
      </a>
    </li>`;
  });
  if (currentGroup) html += '</ul>';
  cont.innerHTML = html;

  cont.querySelectorAll('.nav-link').forEach(a => {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      navigateTo(this.dataset.page);
    });
  });
}

/* ============================================================
   6. NAVEGACIÓN
   ============================================================ */
function navigateTo(pageId) {
  CURRENT_PAGE = pageId;
  FILTER_STATE.type = 'all';
  FILTER_STATE.day = '';
  FILTER_STATE.month = '';
  FILTER_STATE.quarter = '';
  RAW_DATA = null;
  destroyAllCharts();

  $$('#navContainer li').forEach(li => {
    li.classList.toggle('active', li.dataset.page === pageId);
  });
  $('#pcSidebar').classList.remove('open');
  renderPage(pageId);
}

/* ============================================================
   7. RENDER DE PÁGINA
   ============================================================ */
function renderPage(pageId) {
  const meta = NAV.find(n => n.id === pageId) || NAV[0];
  $('#pageTitle').textContent = meta.title;
  $('#pageCrumb').textContent = meta.crumb;
  $('#filterBarContainer').innerHTML = '';
  destroyAllCharts();
  $('#viewContainer').innerHTML =
    `<div class="loader"><div class="spinner"></div><p>Cargando…</p></div>`;

  if (pageId === 'dashboard') {
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(renderError)
      .getDashboardData();
  } else {
    google.script.run
      .withSuccessHandler(resp => renderGeneric(pageId, resp))
      .withFailureHandler(renderError)
      .getPageData(pageId);
  }
}

function renderError(err) {
  $('#viewContainer').innerHTML =
    '<p class="err">Error: ' + esc(err.message) + '</p>';
}

/* ============================================================
   8. DASHBOARD
   ============================================================ */
function renderDashboard(resp) {
  if (!resp.ok) { renderError({ message: resp.error }); return; }
  const d = resp.data;
  const cards = [
    { id:'pos-propios',    label:'POS Propios',      kpi:d.posPropios,     ico:'💳' },
    { id:'pos-otros',      label:'POS Otros Bancos', kpi:d.posOtros,       ico:'🏦' },
    { id:'p2p',            label:'P2P',              kpi:d.p2p,            ico:'🔁' },
    { id:'transferencias', label:'Transferencias',   kpi:d.transferencias, ico:'📤' }
  ];

  $('#viewContainer').innerHTML = `
    <div class="dash-grid">
      ${cards.map(c => {
        const k = c.kpi || {};
        return `<a class="dash-card" data-page="${c.id}" href="javascript:void(0)">
          <div class="dash-ico">${c.ico}</div>
          <p>${esc(c.label)}</p>
          <h2>${fmtPct(k.tasaAprob)}</h2>
          <small style="color:var(--muted)">${fmtInt(k.total)} ops · ${fmtInt(k.rech)} rech.</small>
          <span class="arrow">›</span>
        </a>`;
      }).join('')}
    </div>
    <div class="chart-card" style="margin-top:22px">
      <h3>Evolución · POS Propios (Tasa de aprobación %)</h3>
      <div class="chart-wrap"><canvas id="chartGlobal"></canvas></div>
    </div>
  `;

  $('#viewContainer').querySelectorAll('.dash-card').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.page));
  });

  const cc = chartColors();
  const labels = (d.posRows || []).map(r => r.fecha);
  const data   = (d.posRows || []).map(r => +(r.tasaAprob * 100).toFixed(2));
  if (labels.length) {
    const chart = new Chart($('#chartGlobal'), {
      type: 'bar',
      data: { labels, datasets: [{
        data,
        backgroundColor: '#4099ff',
        hoverBackgroundColor: '#2d7fd6',
        borderRadius: 5,
        borderSkipped: false
      }]},
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor: document.documentElement.getAttribute('data-theme')==='dark'
              ? '#1a2332' : '#2b3445',
            titleColor:'#fff', bodyColor:'#fff',
            padding:10, cornerRadius:8,
            callbacks:{ label: ctx => ' ' + ctx.parsed.y.toFixed(2) + '%' }
          }
        },
        scales:{
          y:{
            beginAtZero:true, max:100,
            grid:{ color: cc.grid },
            ticks:{ color: cc.text, callback: v => v + '%' }
          },
          x:{ grid:{display:false}, ticks:{ color: cc.text } }
        }
      }
    });
    chartRefs.push(chart);
  }
  $('#lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-VE');
}

/* ============================================================
   9. VISTA GENÉRICA
   ============================================================ */
function renderGeneric(pageId, resp) {
  if (!resp.ok) { renderError({ message: resp.error }); return; }
  if (pageId === 'estadistica-diaria') { renderEstDiaria(resp.data); return; }
  if (pageId === 'est-semanales')      { renderEstSemanal(resp.data); return; }
  if (pageId === 'est-trimestrales')   { renderEstTrimestral(resp.data); return; }

  RAW_DATA = resp.data;
  renderFilterBar();
  renderGenericBody();
}

/* ============================================================
   10. FILTROS
   ============================================================ */
function renderFilterBar() {
  const cont = $('#filterBarContainer');
  if (!FILTERED_PAGES.has(CURRENT_PAGE)) { cont.innerHTML = ''; return; }

  const f = FILTER_STATE;
  const hasFilter = f.type !== 'all';
  const totalDias = RAW_DATA && RAW_DATA.rows ? RAW_DATA.rows.length : 0;
  const visibles  = RAW_DATA ? applyFilter(RAW_DATA.rows).length : 0;

  cont.innerHTML = `
    <div class="filter-bar">
      <span class="filter-bar-label">🔎 Filtrar:</span>
      <div class="filter-segment">
        <button data-type="all"     class="${f.type==='all'?'active':''}">Todo</button>
        <button data-type="day"     class="${f.type==='day'?'active':''}">Día</button>
        <button data-type="month"   class="${f.type==='month'?'active':''}">Mes</button>
        <button data-type="quarter" class="${f.type==='quarter'?'active':''}">Trimestre</button>
      </div>
      <div class="filter-inputs" id="filterInputs">${renderFilterInputsHTML()}</div>
      ${hasFilter ? `<span class="filter-badge">${visibles} / ${totalDias} días</span>` : ''}
      <button class="btn-clear" id="btnClearFilter" ${hasFilter?'':'disabled'}>🗑 Limpiar</button>
    </div>
  `;

  cont.querySelectorAll('.filter-segment button').forEach(b => {
    b.addEventListener('click', () => {
      FILTER_STATE.type = b.dataset.type;
      if (b.dataset.type === 'day' && !FILTER_STATE.day)         FILTER_STATE.day = '2026-09-01';
      if (b.dataset.type === 'month' && !FILTER_STATE.month)     FILTER_STATE.month = '2026-09';
      if (b.dataset.type === 'quarter' && !FILTER_STATE.quarter) FILTER_STATE.quarter = '2026-Q3';
      renderFilterBar();
      renderGenericBody();
    });
  });

  const clr = $('#btnClearFilter');
  if (clr) clr.addEventListener('click', clearFilter);
  wireFilterInputs();
}

function renderFilterInputsHTML() {
  const f = FILTER_STATE;
  if (f.type === 'day') {
    return `<input type="date" id="filterDayInput" value="${f.day || '2026-09-01'}"
      min="2026-09-01" max="2026-09-30">`;
  }
  if (f.type === 'month') {
    return `<input type="month" id="filterMonthInput" value="${f.month || '2026-09'}"
      min="2026-01" max="2026-12">`;
  }
  if (f.type === 'quarter') {
    const cur = f.quarter || '2026-Q3';
    const [yy, qq] = cur.split('-Q');
    return `
      <select id="filterQuarterYear">
        <option value="2026" ${yy==='2026'?'selected':''}>2026</option>
      </select>
      <select id="filterQuarterQ">
        <option value="1" ${qq==='1'?'selected':''}>Q1 (Ene–Mar)</option>
        <option value="2" ${qq==='2'?'selected':''}>Q2 (Abr–Jun)</option>
        <option value="3" ${qq==='3'?'selected':''}>Q3 (Jul–Sep)</option>
        <option value="4" ${qq==='4'?'selected':''}>Q4 (Oct–Dic)</option>
      </select>`;
  }
  return '';
}

function wireFilterInputs() {
  const f = FILTER_STATE;
  const d = $('#filterDayInput');
  if (d) d.addEventListener('change', () => { f.day = d.value; refreshFilterAndBody(); });
  const m = $('#filterMonthInput');
  if (m) m.addEventListener('change', () => { f.month = m.value; refreshFilterAndBody(); });
  const qy = $('#filterQuarterYear');
  const qq = $('#filterQuarterQ');
  const updQ = () => { if (qy && qq) { f.quarter = qy.value + '-Q' + qq.value; refreshFilterAndBody(); } };
  if (qy) qy.addEventListener('change', updQ);
  if (qq) qq.addEventListener('change', updQ);
}

function refreshFilterAndBody() {
  const cont = $('#filterBarContainer');
  if (cont) {
    const badge = cont.querySelector('.filter-badge');
    const hasFilter = FILTER_STATE.type !== 'all';
    const totalDias = RAW_DATA && RAW_DATA.rows ? RAW_DATA.rows.length : 0;
    const visibles  = RAW_DATA ? applyFilter(RAW_DATA.rows).length : 0;
    if (hasFilter && badge) {
      badge.textContent = `${visibles} / ${totalDias} días`;
    } else if (hasFilter && !badge) {
      const inputs = cont.querySelector('#filterInputs');
      if (inputs) {
        const sp = document.createElement('span');
        sp.className = 'filter-badge';
        sp.textContent = `${visibles} / ${totalDias} días`;
        inputs.insertAdjacentElement('afterend', sp);
      }
    }
    const clr = $('#btnClearFilter');
    if (clr) clr.disabled = !hasFilter;
  }
  renderGenericBody();
}

function clearFilter() {
  FILTER_STATE.type = 'all';
  FILTER_STATE.day = '';
  FILTER_STATE.month = '';
  FILTER_STATE.quarter = '';
  renderFilterBar();
  renderGenericBody();
}

/* ============================================================
   11. FILTRADO
   ============================================================ */
function applyFilter(rows) {
  if (!rows) return [];
  const f = FILTER_STATE;
  if (f.type === 'all') return rows;

  if (f.type === 'day' && f.day) {
    const [yy, mm, dd] = f.day.split('-');
    const target = `${dd}/${mm}`;
    return rows.filter(r => r.fecha === target);
  }
  if (f.type === 'month' && f.month) {
    const [yy, mm] = f.month.split('-');
    return rows.filter(r => {
      const d = toDateObj(r.fecha);
      return d && d.getFullYear() === Number(yy) && (d.getMonth() + 1) === Number(mm);
    });
  }
  if (f.type === 'quarter' && f.quarter) {
    const [yy, qq] = f.quarter.split('-Q');
    const qi = Number(qq);
    const startM = (qi - 1) * 3 + 1;
    const endM = startM + 2;
    return rows.filter(r => {
      const d = toDateObj(r.fecha);
      if (!d) return false;
      const m = d.getMonth() + 1;
      return d.getFullYear() === Number(yy) && m >= startM && m <= endM;
    });
  }
  return rows;
}

/* ============================================================
   12. RECALCULAR KPIs
   ============================================================ */
function recalcKpi(rows, original) {
  const base = Object.assign({}, original || {});
  if (!rows.length) {
    return Object.assign(base, { total:0, aprob:0, rech:0, tasaAprob:0, tasaRech:0 });
  }
  const sum = k => rows.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const totalField = (rows[0].emitidas !== undefined) ? 'emitidas' : 'total';
  const total = sum(totalField);
  const aprob = sum('aprob');
  const rech  = sum('rech');
  Object.assign(base, {
    total, aprob, rech,
    tasaAprob: total ? aprob/total : 0,
    tasaRech:  total ? rech/total  : 0
  });
  if (rows[0].sofnet !== undefined) {
    base.sofnet   = sum('sofnet');
    base.appMovil = sum('appMovil');
    const t = base.sofnet + base.appMovil;
    base.usoApp    = t ? base.appMovil / t : 0;
    base.usoSofnet = t ? base.sofnet  / t : 0;
  }
  return base;
}

/* ============================================================
   13. RENDER CUERPO GENÉRICO
   ============================================================ */
function renderGenericBody() {
  if (!RAW_DATA) return;
  const cfg = PAGES_CFG[CURRENT_PAGE];
  if (!cfg) {
    $('#viewContainer').innerHTML = '<p class="err">Configuración no encontrada.</p>';
    return;
  }

  const rows = applyFilter(RAW_DATA.rows || []);
  const kpi  = recalcKpi(rows, RAW_DATA.kpi);

  destroyAllCharts();

  if (!rows.length) {
    $('#viewContainer').innerHTML = `
      <div class="filter-empty">
        <div class="ico">🔍</div>
        <p><b>Sin datos para el filtro seleccionado</b></p>
        <small>Prueba con otro rango o pulsa "🗑 Limpiar" para ver todo.</small>
      </div>`;
    return;
  }

  // KPI cards
  let kpiHtml = '<div class="kpi-grid">';
  cfg.cards.forEach(c => {
    let val = kpi[c.key];
    if (c.agg) val = rows.reduce((a,r) => a + (Number(r[c.agg]) || 0), 0);
    const txt = c.type === 'pct' ? fmtPct(val) : fmtInt(val);
    kpiHtml += `<div class="kpi ${c.cls||''}">
      <span class="kpi-ico">${c.ico||''}</span>
      <span class="kpi-label">${esc(c.label)}</span>
      <span class="kpi-value">${txt}</span>
    </div>`;
  });
  kpiHtml += '</div>';

  // Charts
  let chartHtml = '<div class="chart-grid">';
  cfg.charts.forEach((ch, i) => {
    chartHtml += `<div class="chart-card">
      <h3>${esc(ch.title || 'Gráfico')}</h3>
      <div class="chart-wrap"><canvas id="chart${i+1}"></canvas></div>
    </div>`;
  });
  chartHtml += '</div>';

  // Table
  let tableHtml = `<div class="table-card">
    <h3>Detalle diario ${FILTER_STATE.type!=='all' ? '<span class="filter-badge">Filtrado</span>' : ''}</h3>
    <div class="table-scroll"><table class="data">
      <thead><tr>${cfg.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>`;
  rows.slice().reverse().forEach(r => {
    tableHtml += '<tr>';
    cfg.columns.forEach(c => {
      let v = r[c.key];
      if (c.fmt === 'pct') {
        const raw = Number(v) || 0;
        const pill = raw >= 0.9 ? 'ok' : raw >= 0.8 ? 'warn' : 'bad';
        tableHtml += `<td><span class="pill ${pill}">${fmtPct(raw)}</span></td>`;
      } else if (c.fmt === 'int') {
        tableHtml += `<td class="num">${fmtInt(v)}</td>`;
      } else if (c.fmt === 'num') {
        tableHtml += `<td class="num">${fmtNum(v, c.dec||0)}</td>`;
      } else {
        tableHtml += `<td>${esc(v)}</td>`;
      }
    });
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table></div></div>';

  $('#viewContainer').innerHTML = kpiHtml + chartHtml + tableHtml;

  // Gráficos en barras
  const cc = chartColors();
  const labels = rows.map(r => r.fecha);
  cfg.charts.forEach((ch, i) => {
    const canvas = document.getElementById('chart' + (i+1));
    if (!canvas) return;

    const data = rows.map(r => {
      let v = Number(r[ch.field]) || 0;
      if (ch.scale) v *= ch.scale;
      return +v.toFixed(2);
    });
    const color = ch.color || '#4099ff';
    const isPercent = ch.scale === 100;

    const yScale = {
      beginAtZero: true,
      grid: { color: cc.grid },
      ticks: {
        color: cc.text,
        callback: isPercent ? (v => v + '%') : undefined
      }
    };
    if (isPercent) yScale.max = 100;

    const chart = new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets: [{
        data,
        backgroundColor: color,
        hoverBackgroundColor: color,
        borderRadius: 5,
        borderSkipped: false
      }]},
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor: document.documentElement.getAttribute('data-theme')==='dark'
              ? '#1a2332' : '#2b3445',
            titleColor:'#fff', bodyColor:'#fff',
            padding:10, cornerRadius:8,
            callbacks:{
              label: ctx => isPercent
                ? ' ' + ctx.parsed.y.toFixed(2) + '%'
                : ' ' + ctx.parsed.y.toLocaleString('es-VE')
            }
          }
        },
        scales:{
          y: yScale,
          x: { grid:{display:false}, ticks:{ color: cc.text } }
        }
      }
    });
    chartRefs.push(chart);
  });

  $('#lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-VE');
}

/* ============================================================
   14. REPORTES
   ============================================================ */
function renderEstDiaria(d) {
  const rows = d.rows || [];
  if (!rows.length) { $('#viewContainer').innerHTML = '<p class="err">Sin registros.</p>'; return; }
  $('#viewContainer').innerHTML = '<div class="obs-list">' + rows.map(r => `
    <div class="obs-card">
      <h4>${esc(r.titulo || r.estadistica || 'Registro')}</h4>
      ${r.estadistica ? '<pre>' + esc(r.estadistica) + '</pre>' : ''}
      ${r.observaciones ? '<pre style="border-top:1px dashed var(--border);margin-top:12px;padding-top:12px"><b>Observaciones:</b>\n' + esc(r.observaciones) + '</pre>' : ''}
      ${r.cierreT1 ? '<details style="margin-top:12px"><summary>▸ Cierre T1 (8:00AM / 4:30PM)</summary><pre style="margin-top:8px">' + esc(r.cierreT1) + '</pre></details>' : ''}
      ${r.cierreT2 ? '<details style="margin-top:8px"><summary>▸ Cierre T2 (4:30PM / 8:00AM)</summary><pre style="margin-top:8px">' + esc(r.cierreT2) + '</pre></details>' : ''}
    </div>
  `).join('') + '</div>';
  $('#lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-VE');
}

function renderEstSemanal(d) {
  const rows = d.rows || [];
  const fmtV = v => (typeof v === 'number' && v > 0 && v <= 1) ? fmtPct(v)
                : (typeof v === 'number' ? fmtInt(v) : esc(v));
  $('#viewContainer').innerHTML = `<div class="table-card">
    <h3>KPIs por semana</h3>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Indicador</th><th>1-6 Sep</th><th>7-13 Sep</th><th>14-20 Sep</th><th>21-30 Sep</th><th>Total</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td style="font-weight:600">${esc(r.indicador)}</td>
          <td class="num">${fmtV(r.s1)}</td>
          <td class="num">${fmtV(r.s2)}</td>
          <td class="num">${fmtV(r.s3)}</td>
          <td class="num">${fmtV(r.s4)}</td>
          <td class="num" style="font-weight:700">${fmtV(r.total)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
  $('#lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-VE');
}

function renderEstTrimestral(d) {
  const m = d.matrix || [];
  const rows = m.filter(r => r.some(c => c !== '' && c !== null && c !== undefined));
  const maxCols = Math.max.apply(null, rows.map(r => r.length));
  $('#viewContainer').innerHTML = `<div class="table-card">
    <h3>Matriz mensual (Jul · Ago · Sep)</h3>
    <div class="table-scroll"><table class="data">
      <thead><tr>${Array.from({length:maxCols}).map((_,i) =>
        '<th>Col ' + String.fromCharCode(65+i) + '</th>').join('')}</tr></thead>
      <tbody>
        ${rows.map(r => {
          const tds = Array.from({length:maxCols}).map((_,i) => {
            let v = r[i];
            if (typeof v === 'number') {
              v = (v > 0 && v <= 1) ? fmtPct(v) : (Number.isInteger(v) ? fmtInt(v) : fmtNum(v,2));
            } else { v = esc(v); }
            return '<td>' + v + '</td>';
          }).join('');
          return '<tr>' + tds + '</tr>';
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
  $('#lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-VE');
}
